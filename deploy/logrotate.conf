# 日志轮转配置示例（可选，不需要 sudo）
#
# 服务只往 stdout 写日志；后台模式下父进程把 stdout 重定向到
# ~/.local/state/tavily-proxy/tavily-proxy.log。这份配置是"环境"那一侧做轮转的一种做法。
#
# 用法：加一条自己的 cron，例如每天 03:17 跑一次：
#   17 3 * * * /usr/sbin/logrotate -s $HOME/.local/state/tavily-proxy/logrotate.state $HOME/.config/tavily-proxy.logrotate
#
# 换机器时把下面的路径改成自己的 HOME（logrotate 不展开 ~）。

/home/you/.local/state/tavily-proxy/tavily-proxy.log {
    weekly
    rotate 8
    maxsize 10M
    missingok
    notifempty
    compress
    delaycompress
    # 必须用 copytruncate：后台实例整个生命周期都持着这个文件的 fd（它的 stdout 就是这里），
    # 只 rename 的话它会继续往已轮转的文件里写。
    copytruncate
}
